name: Commercial Lighthouse
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit mobile landing
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lanzate-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          npx --yes lighthouse@12.8.2 http://127.0.0.1:8765/ --chrome-flags="--headless --no-sandbox" --output=json --output-path=./lighthouse-report.json --quiet
          node -e 'const r=require("./lighthouse-report.json"); for(const [k,v] of Object.entries(r.categories)) console.log(k,v.score); if(r.runtimeError || r.categories.performance.score<0.8 || r.categories.accessibility.score<0.9 || r.categories.seo.score<0.9 || r.categories["best-practices"].score<0.9) process.exit(1)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-lighthouse
          path: lighthouse-report.json
          if-no-files-found: error
