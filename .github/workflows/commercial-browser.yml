name: Commercial browser QA
on:
  pull_request:
    branches: [main, qa/auditoria-comercial-rc1]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1 axe-core@4.11.0
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Run isolated commercial audit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/lanzate-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          node scripts/test-commercial-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-rc-report
          path: commercial-rc-report.json
          if-no-files-found: error
